<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <title>Cookable – AI Recipe Recommender</title>
    <meta
      name="description"
      content="Turn the ingredients you already have into a recipe, powered by Google Gemini."
    />
    <!-- Apply the saved or system theme before first paint, so the page never flashes the wrong theme -->
    <script>
      try {
        const saved = localStorage.getItem("theme");
        const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
