[project]
name = "cookable-backend"
version = "1.0.0"
description = "Cookable API: AI-powered recipe recommendations"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.16",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
# This is an application, not a library to publish
package = false
